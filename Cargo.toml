[package]
name = "retrocrunch"
version = "0.13.0"
edition = "2024"
# PolyForm Shield 1.0.0 (not an SPDX id); godot/ and blender/ are MIT-0. See LICENSE.md.
license-file = "LICENSE.md"
# Sold as ready-built releases; not published to crates.io.
publish = false

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "gif"] }
tobj = "4"
gltf = { version = "1.4", features = ["import", "extras"] }
meshopt = "0.7"
ufbx = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
glam = { version = "0.29", features = ["serde"] }
png = "0.18"
# Lospec palette import (HTTPS via rustls).
ureq = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
