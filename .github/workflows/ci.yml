# Tests every push and pull request on Windows and macOS, so platform differences show
# up before a release tag is pushed.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Pinned Rust: new compiler releases add Clippy lints. Raise it on purpose (and in
      # release.yml) after checking the code against the new version locally.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97.1"
          components: clippy
      - name: Test
        run: cargo test --locked
      # Runs even when tests fail, so one run reports both.
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
