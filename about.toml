# cargo-about config for THIRD_PARTY_LICENSES.html (see "Licence" in README.md).
# Order is preference: for "A OR B" crates the first accepted licence is listed.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Retrocrunch itself is under LICENSE.md, not a crate licence.
private = { ignore = true }

# egui's default fonts: Ubuntu-Light is under the Ubuntu Font Licence.
[epaint_default_fonts.clarify]
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND LicenseRef-UFL-1.0"

[[epaint_default_fonts.clarify.files]]
path = "fonts/UFL.txt"
license = "LicenseRef-UFL-1.0"
checksum = "2f0015108d68627bd788d313f529c21ff4da2c2c42a5e1f3883acc83480f9002"

[[epaint_default_fonts.clarify.files]]
path = "fonts/OFL.txt"
license = "OFL-1.1"
checksum = "6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2"
